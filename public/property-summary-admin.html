<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Summary Admin — Regatta</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#EEF4F5;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:13px;color:#1A2B2C}
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:#13545E;display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.sb-header{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-logo{font-size:14px;font-weight:700;color:#fff}
.sb-sub{font-size:10px;color:rgba(255,255,255,.5);margin-top:2px;letter-spacing:.05em;text-transform:uppercase}
.sb-nav{padding:12px 8px;flex:1}
.sb-section{font-size:9px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:.1em;text-transform:uppercase;padding:10px 10px 4px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:5px;cursor:pointer;color:rgba(255,255,255,.75);font-size:12.5px;font-weight:500;transition:background .12s;border:none;background:none;width:100%;text-align:left;font-family:inherit;text-decoration:none}
.sb-item:hover{background:rgba(255,255,255,.1);color:#fff}
.sb-item.active{background:rgba(255,255,255,.18);color:#fff;font-weight:700}
.sb-icon{width:16px;text-align:center;font-size:13px;opacity:.8}
.sb-footer{padding:12px 8px;border-top:1px solid rgba(255,255,255,.1)}
.sb-user{padding:8px 10px;font-size:11.5px;color:rgba(255,255,255,.6)}
.sb-user strong{display:block;color:#fff;font-size:12px;margin-bottom:1px}
.sb-btns{display:flex;gap:6px;margin-top:8px}
.sb-btn{flex:1;padding:6px 0;font-size:11px;font-family:inherit;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:4px;cursor:pointer;text-align:center;text-decoration:none;transition:background .12s;display:block}
.sb-btn:hover{background:rgba(255,255,255,.22)}

/* ── PAGE HEADER ── */
.page-hdr{background:#0D3D45;color:#fff;padding:16px 24px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.page-hdr-left .eyebrow{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.5;font-weight:600;margin-bottom:3px}
.page-hdr-left h1{font-size:20px;font-weight:700}
.page-hdr-right{text-align:right}
.page-hdr-right .lbl{font-size:9px;text-transform:uppercase;letter-spacing:.1em;opacity:.45}
.page-hdr-right .val{font-size:13px;font-weight:700;margin-top:1px}
.page-hdr-right .sub{font-size:10px;font-family:'Courier New',monospace;opacity:.45}

/* ── ACTION BAR ── */
.action-bar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid #D2E8EA;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:9px 24px;display:flex;align-items:center;gap:16px;flex-shrink:0}
.month-sel-wrap{display:flex;align-items:center;gap:8px;padding-right:16px;border-right:1px solid #D2E8EA}
.month-sel-wrap label{font-size:10px;font-weight:700;color:#13545E;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.month-sel-wrap select{border:1px solid #D2E8EA;border-radius:5px;padding:4px 10px;font-size:12.5px;font-weight:600;color:#13545E;background:#fff;outline:none;cursor:pointer;font-family:inherit}
.month-sel-wrap select:focus{border-color:#13545E}
.status-msg{display:flex;align-items:center;gap:6px;font-size:11.5px;flex:1}
.status-msg .icon{font-size:13px}
.status-msg.saved{color:#15803d}.status-msg.error{color:#dc2626}.status-msg.pending{color:#92400e}.status-msg.ok{color:#15803d}
.ab-btns{display:flex;gap:8px;align-items:center;margin-left:auto}
.btn-cancel{padding:5px 14px;font-size:11.5px;font-weight:500;border:1px solid #D2E8EA;background:#fff;border-radius:5px;cursor:pointer;color:#4A6568;font-family:inherit}
.btn-cancel:hover{background:#F4F8F9}
.btn-save{padding:5px 16px;font-size:11.5px;font-weight:600;border:none;background:#13545E;color:#fff;border-radius:5px;cursor:pointer;font-family:inherit}
.btn-save:hover{background:#0D3D45}
.btn-save:disabled,.btn-cancel:disabled{opacity:.45;cursor:not-allowed}

/* ── CONTENT ── */
.content{padding:18px 24px;flex:1}

/* ── PANELS ── */
.panel{background:#fff;border-radius:8px;border:1px solid #D2E8EA;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:14px;overflow:hidden}
.panel-head{padding:12px 18px;border-bottom:1px solid #D2E8EA;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.panel-head.accent{background:#EDF8F6}
.panel-title{font-size:12px;font-weight:700;color:#13545E;display:flex;align-items:center;gap:8px}
.panel-title .badge{font-size:9px;font-weight:700;padding:1.5px 7px;border-radius:10px;background:#E2EEF0;color:#4A6568;text-transform:uppercase;letter-spacing:.07em}
.panel-desc{font-size:10.5px;color:#6A8E91;margin-top:1px}
.panel-chevron{color:#94a3b8;font-size:13px}
.panel-body{display:none}
.panel-body.open{display:block}

/* ── MONTHLY GRID — Metric | Value | Source | Notes | Group ── */
.m-cols{grid-template-columns:minmax(140px,.85fr) 135px 130px minmax(90px,.7fr) 85px}
.m-grid-header,.m-grid-row{display:grid;gap:14px;padding:6px 18px;align-items:center}
.m-grid-header{padding:7px 18px;background:#F8FBFC;border-bottom:1px solid #D2E8EA}
.m-grid-header span{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8}
.m-grid-row{border-bottom:1px solid #F4F8F9;transition:background .08s}
.m-grid-row:last-child{border-bottom:none}
.m-grid-row:hover{background:#FAFCFC}

/* ── SETUP GRID — Metric | Value | As Of Date | Source | Notes | Group ── */
.s-cols{grid-template-columns:minmax(140px,.85fr) 130px 90px 130px minmax(90px,.7fr) 85px}
.s-grid-header,.s-grid-row{display:grid;gap:14px;padding:6px 18px;align-items:center}
.s-grid-header{padding:7px 18px;background:#F8FBFC;border-bottom:1px solid #D2E8EA}
.s-grid-header span{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8}
.s-grid-row{border-bottom:1px solid #F4F8F9;transition:background .08s}
.s-grid-row:last-child{border-bottom:none}
.s-grid-row:hover{background:#FAFCFC}

/* ── RESERVES GRID — Name | Amount | (blank) | (blank) | Notes | del ── */
.r-cols{grid-template-columns:minmax(140px,.85fr) 130px 90px 130px minmax(90px,.7fr) 32px}
.r-grid-header,.r-grid-row{display:grid;gap:14px;padding:6px 18px;align-items:center}
.r-grid-header{padding:7px 18px;background:#F8FBFC;border-bottom:1px solid #D2E8EA}
.r-grid-header span{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8}
.r-grid-row{border-bottom:1px solid #F4F8F9}
.r-grid-row:hover{background:#FAFCFC}

/* ── KEY DATES GRID ── */
.kd-cols{grid-template-columns:minmax(140px,.85fr) 115px 115px minmax(90px,1fr) 32px}
.kd-grid-header,.kd-grid-row{display:grid;gap:14px;padding:6px 18px;align-items:center}
.kd-grid-header{padding:7px 18px;background:#F8FBFC;border-bottom:1px solid #D2E8EA}
.kd-grid-header span{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8}
.kd-grid-row{border-bottom:1px solid #F4F8F9}
.kd-grid-row:hover{background:#FAFCFC}

/* ── CONTACTS GRID ── */
.c-cols{grid-template-columns:1fr 1fr 1.5fr 90px 1fr 32px}
.c-grid-header,.c-grid-row{display:grid;gap:14px;padding:6px 18px;align-items:center}
.c-grid-header{padding:7px 18px;background:#F8FBFC;border-bottom:1px solid #D2E8EA}
.c-grid-header span{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8}
.c-grid-row{border-bottom:1px solid #F4F8F9}
.c-grid-row:hover{background:#FAFCFC}

/* ── GROUP HEADER ── */
.group-hdr{padding:6px 18px;background:#F4F8F9;border-bottom:1px solid #EEF4F5;border-top:1px solid #EEF4F5}
.group-hdr-name{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#13545E;display:flex;align-items:center;gap:5px}

/* ── INPUTS ── */
.cell-name{font-size:12px;color:#1A2B2C;display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden}
.cell-name.dimmed{color:#94a3b8}
.cell-name-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-inp{width:100%;border:none;border-bottom:1px solid transparent;background:transparent;font-size:12px;color:#1A2B2C;padding:2px 0;outline:none;font-family:'Courier New',monospace;transition:border-color .1s}
.cell-inp:focus{border-bottom-color:#13545E}
.cell-inp:hover:not(:focus){border-bottom-color:#D2E8EA}
.cell-inp.right{text-align:right}
.cell-inp.group-inp{font-family:'Segoe UI',system-ui,sans-serif;font-size:11px;color:#6A8E91}
.cell-sel{width:100%;border:none;border-bottom:1px solid transparent;background:transparent;font-size:11px;color:#6A8E91;font-family:'Segoe UI',system-ui,sans-serif;padding:2px 0;outline:none;cursor:pointer;transition:border-color .1s}
.cell-sel:focus,.cell-sel:hover{border-bottom-color:#13545E}

/* ── CALC BADGES ── */
.cell-autocalc{display:flex;align-items:center;gap:4px;color:#94a3b8;font-size:10px;font-style:italic}
.cell-system{display:inline-flex;align-items:center;gap:4px;background:#EEF6FF;border:1px solid #BFDBFE;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:600;color:#1d4ed8;white-space:nowrap}
.cell-system-val{font-size:11.5px;font-weight:600;color:#1A2B2C;font-family:'Courier New',monospace;text-align:right}
.cell-calc{display:inline-flex;align-items:center;gap:4px;background:#F4F8F9;border:1px solid #D2E8EA;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:600;color:#4A6568;white-space:nowrap}
.cell-calc-val{font-size:11.5px;font-weight:600;color:#1A2B2C;font-family:'Courier New',monospace;text-align:right}

/* ── MISC ── */
.cell-sel{width:100%;border:none;border-bottom:1px solid transparent;background:transparent;font-size:11px;color:#6A8E91;padding:2px 0;outline:none;font-family:inherit;cursor:pointer}
.cell-sel:focus{border-bottom-color:#13545E}
.cell-remove{display:flex;align-items:center;justify-content:flex-end}
.btn-remove{border:none;background:none;cursor:pointer;color:#D2E8EA;font-size:15px;padding:0 2px;transition:color .1s}
.btn-remove:hover{color:#dc2626}
.add-row{padding:8px 18px;border-top:1px solid #F4F8F9}
.btn-add{background:none;border:none;cursor:pointer;font-size:11.5px;font-weight:600;color:#13545E;font-family:inherit;display:flex;align-items:center;gap:5px;padding:0}
.btn-add:hover{color:#0D3D45}
.loading-state{padding:40px;text-align:center;color:#6A8E91}
</style>
</head>
<body>
<div class="shell">

  <aside class="sidebar">
    <div class="sb-header">
      <div class="sb-logo">Regatta — 1163_rr</div>
      <div class="sb-sub">Admin Panel</div>
    </div>
    <nav class="sb-nav">
      <div class="sb-section">Data</div>
      <a href="/admin" class="sb-item"><span class="sb-icon">📁</span> File Uploads</a>
      <a href="/admin" class="sb-item"><span class="sb-icon">🗂</span> Mapping Rules</a>
      <div class="sb-section">Asset</div>
      <a href="/property-summary-admin" class="sb-item active"><span class="sb-icon">🏢</span> Property Summary</a>
      <div class="sb-section">Access</div>
      <a href="/admin" class="sb-item"><span class="sb-icon">👥</span> User Permissions</a>
    </nav>
    <div class="sb-footer">
      <div class="sb-user">
        <strong id="sb-email">Loading...</strong>
        <span>Administrator</span>
      </div>
      <div class="sb-btns">
        <a href="/" class="sb-btn">Dashboard</a>
        <form method="POST" action="/logout" style="flex:1">
          <button type="submit" class="sb-btn" style="width:100%">Sign Out</button>
        </form>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="page-hdr">
      <div class="page-hdr-left">
        <div class="eyebrow">Asset Management › Admin</div>
        <h1>Property Summary Admin</h1>
      </div>
      <div class="page-hdr-right">
        <div class="lbl">Property</div>
        <div class="val">Regatta Apartments</div>
        <div class="sub">1163_rr</div>
      </div>
    </div>

    <div class="action-bar">
      <div class="month-sel-wrap">
        <label>📅 Updating:</label>
        <select id="month-sel">
          <option>January 2026</option>
          <option>February 2026</option>
          <option selected>March 2026</option>
          <option>April 2026</option>
          <option>May 2026</option>
          <option>June 2026</option>
          <option>July 2026</option>
          <option>August 2026</option>
        </select>
      </div>
      <div class="status-msg ok" id="status-msg"><span class="icon">✓</span> <span id="status-text">All changes saved</span></div>
      <div class="ab-btns">
        <button class="btn-cancel" id="btn-cancel" onclick="cancelChanges()">Cancel</button>
        <button class="btn-save" id="btn-save" onclick="saveAll()">Save Changes</button>
      </div>
    </div>

    <div class="content" id="content">
      <div class="loading-state">Loading…</div>
    </div>
  </div>

</div>
<script>
/* ═══════════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════════ */
let STATE = {
  month: '2026-mar',
  monthly: [],
  setup: [],
  sectionAssignments: {},   // property-level: { key: 'monthly'|'setup' }
  reserves: [],
  escrows: [],
  keyDates: [],
  contacts: [],
  hasChanges: false,
};
let _dynId = 9000;
function nextId(){ return ++_dynId; }

/* ═══════════════════════════════════════════════════════════════════
   MONTHLY STRUCTURE
═══════════════════════════════════════════════════════════════════ */
const MONTHLY_STRUCTURE = [
  {key:'occupancy_pct',           name:'Occupancy %',               group:'Performance',       readOnly:false, fmt:'pct'},
  {key:'vacancy_pct',             name:'Vacancy %',                 group:'Performance',       readOnly:true,  fmt:'pct',  calcType:'auto',   calcNote:'= 100% − Occupancy %'},
  {key:'dscr',                    name:'DSCR',                      group:'Performance',       readOnly:false, fmt:'dscr'},
  {key:'noi_ltm',                 name:'NOI (LTM)',                 group:'Performance',       readOnly:true,  fmt:'cur',  calcType:'system', calcNote:'From financial actuals'},
  {key:'noi_vs_budget',           name:'NOI vs Budget',             group:'Performance',       readOnly:true,  fmt:'cur',  calcType:'system', calcNote:'From financial actuals'},
  {key:'noi_status',              name:'NOI Status',                group:'Performance',       readOnly:true,             calcType:'auto',   calcNote:'Derived from NOI vs Budget'},
  {key:'initial_op_balance',      name:'Initial Operating Balance', group:'Operating Reserves',readOnly:false, fmt:'cur'},
  {key:'net_cash_flow',           name:'Net Cash Flow To Date',     group:'Operating Reserves',readOnly:false, fmt:'cur'},
  {key:'remaining_reserve_bal',   name:'Remaining Reserve Balance', group:'Operating Reserves',readOnly:true,  fmt:'cur',  calcType:'calc',   calcNote:'= Initial + Net Cash Flow'},
  {key:'expense_coverage_months', name:'Expense Coverage (Months)', group:'Operating Reserves',readOnly:true,             calcType:'auto',   calcNote:'Requires monthly expense data'},
  {key:'capex_spend',             name:'CapEx Spend To Date',       group:'CapEx',             readOnly:false, fmt:'cur'},
  {key:'target_completion_date',  name:'Target Completion Date',    group:'CapEx',             readOnly:false, fmt:'date'},
  {key:'capex_pct_complete',      name:'CapEx % Complete',          group:'CapEx',             readOnly:true,  fmt:'pct',  calcType:'auto',   calcNote:'= Spend ÷ Budget × 100'},
  {key:'capex_status',            name:'CapEx Status',              group:'CapEx',             readOnly:true,             calcType:'auto',   calcNote:'Derived from % vs expected'},
  {key:'current_distrib_ann_usd', name:'Current Distrib. Ann. ($)', group:'Investment',        readOnly:false, fmt:'cur'},
  {key:'current_distrib_ann_pct', name:'Current Distrib. Ann. (%)', group:'Investment',        readOnly:false, fmt:'pct'},
  {key:'itd_distrib_paid_usd',    name:'ITD Distribution Paid ($)', group:'Investment',        readOnly:false, fmt:'cur'},
  {key:'itd_distrib_paid_pct',    name:'ITD Distribution Paid (%)', group:'Investment',        readOnly:false, fmt:'pct'},
  {key:'cum_pref_shortfall',      name:'Cumulative Pref Shortfall', group:'Investment',        readOnly:false, fmt:'cur'},
  {key:'capital_returned',        name:'Capital Returned',          group:'Investment',        readOnly:false, fmt:'cur'},
];

/* ═══════════════════════════════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════════════════════════════ */
function toMonthKey(label){
  const p=label.trim().split(/\s+/);
  return `${p[p.length-1]}-${p[0].slice(0,3).toLowerCase()}`;
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function parseRaw(s){
  if(!s) return null;
  const str=String(s).trim();
  if(!str||str==='—') return null;
  const neg=/^\(/.test(str)||(/^-/.test(str)&&!str.startsWith('--'));
  const clean=str.replace(/[\$,\s\(\)%x]/g,'').replace(/^-/,'');
  const n=parseFloat(clean);
  return isNaN(n)?null:(neg?-n:n);
}

function fmtVal(raw, fmt){
  if(!raw&&raw!==0) return raw||'';
  if(!fmt||fmt==='date') return raw;
  const n=parseRaw(String(raw));
  if(n==null) return raw;
  switch(fmt){
    case 'cur':{
      const neg=n<0;
      const s='$'+Math.round(Math.abs(n)).toLocaleString();
      return neg?`(${s})`:s;
    }
    case 'pct': return n.toFixed(1)+'%';
    case 'dscr': return n.toFixed(2)+'x';
    default: return raw;
  }
}

function detectFmt(v){
  const s=String(v||'').trim();
  if(!s) return null;
  if(/^\(?\$[\d,]+\)?$/.test(s)) return 'cur';
  if(/^[\d.]+%$/.test(s)) return 'pct';
  if(/^[\d.]+x$/.test(s)) return 'dscr';
  return null;
}

/* ═══════════════════════════════════════════════════════════════════
   COMPUTED: Remaining Reserve Balance — updates DOM directly, no re-render
═══════════════════════════════════════════════════════════════════ */
function computeRemaining(){
  const initial  = STATE.monthly.find(m=>m.key==='initial_op_balance');
  const netCF    = STATE.monthly.find(m=>m.key==='net_cash_flow');
  const remaining= STATE.monthly.find(m=>m.key==='remaining_reserve_bal');
  if(!initial||!netCF||!remaining) return;
  const iNum=parseRaw(initial.value), nNum=parseRaw(netCF.value);
  if(iNum!=null&&nNum!=null){
    remaining.value=fmtVal(String(Math.round(iNum+nNum)),'cur');
    const el=document.getElementById('remaining-calc-val');
    if(el) el.textContent=remaining.value;
  }
}

/* ═══════════════════════════════════════════════════════════════════
   COMMIT HANDLERS — called on blur; no renderAll()
═══════════════════════════════════════════════════════════════════ */
function commitMonthly(i, field, el){
  let v=el.value;
  const m=STATE.monthly[i];
  if(field==='value'&&m.fmt&&m.fmt!=='date'){
    const formatted=fmtVal(v,m.fmt);
    if(formatted){ v=formatted; el.value=v; }
  }
  m[field]=v;
  if(field==='value'&&(m.key==='initial_op_balance'||m.key==='net_cash_flow')){
    computeRemaining();
  }
  markChanged();
}

function commitSetup(i, field, el){
  let v=el.value;
  if(field==='value'){
    const fmt=detectFmt(v);
    if(fmt){ const f=fmtVal(v,fmt); if(f){ v=f; el.value=v; } }
  }
  STATE.setup[i][field]=v;
  markChanged();
}

function commitReserve(i,field,el){ 
  let v=el.value;
  if(field==='amount'){ const f=fmtVal(v,'cur'); if(f){ v=f; el.value=v; } }
  STATE.reserves[i][field]=v; 
  markChanged(); 
}
function commitEscrow(i,field,el) { 
  let v=el.value;
  if(field==='amount'){ const f=fmtVal(v,'cur'); if(f){ v=f; el.value=v; } }
  STATE.escrows[i][field]=v;  
  markChanged(); 
}
function changeSection(fromType, i, newSection){
  const m = fromType==='monthly' ? STATE.monthly[i] : STATE.setup[i];
  m.section = newSection;
  STATE.sectionAssignments[m.key] = newSection;   // persist at property level
  markChanged();
  renderAll();
}
function commitKeyDate(i,field,el){ STATE.keyDates[i][field]=el.value; markChanged(); }
function commitContact(i,field,el){ STATE.contacts[i][field]=el.value; markChanged(); }
function commitContactSel(i,el)   { STATE.contacts[i].type=el.value;   markChanged(); }

/* ═══════════════════════════════════════════════════════════════════
   STATUS
═══════════════════════════════════════════════════════════════════ */
function setStatus(type,msg){
  const el=document.getElementById('status-msg');
  const icons={ok:'✓',saved:'✓',error:'✗',pending:'!',loading:'↻'};
  el.className='status-msg '+(type==='loading'?'ok':type);
  document.getElementById('status-text').textContent=msg;
  el.querySelector('.icon').textContent=icons[type]||'✓';
}
function markChanged(){ STATE.hasChanges=true; setStatus('pending','Unsaved changes'); }

/* ═══════════════════════════════════════════════════════════════════
   PANEL TOGGLE
═══════════════════════════════════════════════════════════════════ */
function togglePanel(id){
  const body=document.getElementById('body-'+id);
  const ch=document.getElementById('chevron-'+id);
  const open=body.classList.toggle('open');
  ch.textContent=open?'▼':'▶';
}

/* ═══════════════════════════════════════════════════════════════════
   INPUT BUILDER
   - onfocus: select all text
   - onkeydown: Enter triggers blur (commit)
   - onblur: commit handler (no re-render)
═══════════════════════════════════════════════════════════════════ */
function inp(value, right, blurFn, extraClass=''){
  const align=right?' right':'';
  return `<input type="text" class="cell-inp${align}${extraClass?' '+extraClass:''}" value="${esc(value)}" placeholder="—" onfocus="this.select()" onkeydown="if(event.key==='Enter')this.blur()" onblur="${blurFn}">`;
}

/* ═══════════════════════════════════════════════════════════════════
   LOAD
═══════════════════════════════════════════════════════════════════ */
async function loadData(){
  setStatus('loading','Loading…');
  try{
    const [d,me]=await Promise.all([
      fetch(`/api/property-summary/admin?month=${STATE.month}`).then(r=>r.json()),
      fetch('/api/me').then(r=>r.json())
    ]);
    document.getElementById('sb-email').textContent=me.email||'Admin';

    // Property-level section assignments: persist across month switches
    STATE.sectionAssignments = d.sectionAssignments || {};
    const sec = STATE.sectionAssignments;

    const apiMap={};
    for(const m of (d.monthlyMetrics||[])) apiMap[m.key]=m;

    STATE.monthly=MONTHLY_STRUCTURE.map(s=>{
      const a=apiMap[s.key]||{};
      const raw=a.value||'';
      const display=(!s.readOnly&&s.fmt)?fmtVal(raw,s.fmt)||raw:raw;
      // Section comes from property-level assignments, NOT per-month data
      const section = sec[s.key] !== undefined ? sec[s.key] : 'monthly';
      return { key:s.key, name:s.name, group:s.group, readOnly:s.readOnly,
               fmt:s.fmt, calcType:s.calcType, calcNote:s.calcNote,
               section,
               value:display, source:a.source||'', notes:a.notes||'' };
    });

    computeRemaining();

    const MONTHLY_KEYS=new Set(MONTHLY_STRUCTURE.map(s=>s.key));
    STATE.setup=(d.setupMetrics||[])
      .filter(m=>!MONTHLY_KEYS.has(m.key))
      .map(m=>({
        key:m.key, name:m.name, group:m.group,
        // Section comes from property-level assignments, NOT per-record data
        section: sec[m.key] !== undefined ? sec[m.key] : 'setup',
        value:m.value||'', asOf:m.asOf||'', source:m.source||'', notes:m.notes||''
      }));
    STATE.reserves=(d.reserves||[]).map((r,i)=>({id:r.id??200+i,name:r.name||'',amount:fmtVal(r.amount||'','cur')||r.amount||''}));
    STATE.escrows =(d.escrows ||[]).map((e,i)=>({id:e.id??300+i,name:e.name||'',amount:fmtVal(e.amount||'','cur')||e.amount||''}));
    STATE.keyDates=(d.keyDates||[]).map((kd,i)=>({id:kd.id??400+i,label:kd.label||'',dueDate:kd.dueDate||'',completed:kd.completed||'',notes:kd.notes||''}));
    STATE.contacts=(d.contacts||[]).map((c,i)=>({id:c.id??500+i,label:c.label||'',name:c.name||'',emailOrUrl:c.emailOrUrl||'',type:c.type||'email',notes:c.notes||''}));

    STATE.hasChanges=false;
    renderAll();
    setStatus('ok','All changes saved');
  }catch(e){
    setStatus('error','Failed to load data');
    document.getElementById('content').innerHTML='<div class="loading-state">Failed to load data.</div>';
  }
}

/* ═══════════════════════════════════════════════════════════════════
   VALUE CELL for monthly rows (readonly = badge; editable = input)
═══════════════════════════════════════════════════════════════════ */
function monthlyValCell(m, ki){
  if(!m.readOnly){
    const right=m.fmt&&m.fmt!=='date'?true:(m.fmt==='date');
    return inp(m.value, right, `commitMonthly(${ki},'value',this)`);
  }
  if(m.calcType==='system'){
    return m.value&&m.value!=='—'
      ? `<div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px"><div class="cell-system"><span>📊</span> From Actuals</div><div class="cell-system-val">${esc(m.value)}</div></div>`
      : `<div class="cell-system"><span>📊</span> Not yet uploaded</div>`;
  }
  if(m.calcType==='calc'){
    const idAttr=m.key==='remaining_reserve_bal'?' id="remaining-calc-val"':'';
    return m.value&&m.value!=='—'
      ? `<div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px"><div class="cell-calc">= ${esc(m.calcNote||'Calculated')}</div><div class="cell-calc-val"${idAttr}>${esc(m.value)}</div></div>`
      : `<div class="cell-calc">= ${esc(m.calcNote||'Calculated')}</div>`;
  }
  return `<div class="cell-autocalc">↻ ${esc(m.calcNote||'Auto-calc')}</div>`;
}

/* ═══════════════════════════════════════════════════════════════════
   RENDER — only called on load / cancel / save-complete, NOT on input
═══════════════════════════════════════════════════════════════════ */
function renderAll(){
  const monthLabel=document.getElementById('month-sel').value;

  // ── Build panel lists: each entry carries _src ('monthly'|'setup') and _idx
  const inMonthly=[], inSetup=[];
  STATE.monthly.forEach((m,i)=>{
    (m.section==='setup'?inSetup:inMonthly).push({...m,_src:'monthly',_idx:i});
  });
  STATE.setup.forEach((m,i)=>{
    (m.section==='monthly'?inMonthly:inSetup).push({...m,_src:'setup',_idx:i});
  });

  // ── Group monthly-panel items
  const gm={}, om=[];
  for(const m of inMonthly){
    if(!gm[m.group]){gm[m.group]=[];om.push(m.group);}
    gm[m.group].push(m);
  }
  // ── Group setup-panel items
  const gs={}, os=[];
  for(const m of inSetup){
    if(!gs[m.group]){gs[m.group]=[];os.push(m.group);}
    gs[m.group].push(m);
  }

  // ── MONTHLY HTML
  let mHTML=`<div class="m-grid-header m-cols">
    <span>Metric</span>
    <span style="text-align:right">Value — ${esc(monthLabel)}</span>
    <span>Source</span>
    <span>Notes</span>
    <span>Section</span>
  </div>`;
  for(const g of om){
    mHTML+=`<div class="group-hdr"><span class="group-hdr-name">📂 ${g}</span></div>`;
    for(const m of gm[g]){
      const ki=m._idx, src=m._src;
      const ro=m.readOnly;
      let valCell, srcCell, noteCell;
      if(src==='monthly'){
        valCell=monthlyValCell(m,ki);
        srcCell=ro?`<div style="font-size:10.5px;color:#94a3b8">${esc(m.source)||'—'}</div>`:inp(m.source,false,`commitMonthly(${ki},'source',this)`);
        noteCell=ro?`<div style="font-size:10.5px;color:#94a3b8">${esc(m.notes)||'—'}</div>`:inp(m.notes,false,`commitMonthly(${ki},'notes',this)`);
      } else {
        valCell=inp(m.value,true,`commitSetup(${ki},'value',this)`);
        srcCell=inp(m.source,false,`commitSetup(${ki},'source',this)`);
        noteCell=inp(m.notes,false,`commitSetup(${ki},'notes',this)`);
      }
      mHTML+=`<div class="m-grid-row m-cols">
        <div class="cell-name ${ro?'dimmed':''}">
          <span class="cell-name-text" title="${esc(m.name)}">${esc(m.name)}</span>
        </div>
        ${valCell}${srcCell}${noteCell}
        <select class="cell-sel" onchange="changeSection('${src}',${ki},this.value)">
          <option value="monthly" selected>Monthly Updates</option>
          <option value="setup">Setup &amp; Property Data</option>
        </select>
      </div>`;
    }
  }

  // ── SETUP HTML
  let sHTML=`<div class="s-grid-header s-cols">
    <span>Metric</span>
    <span style="text-align:right">Value</span>
    <span style="text-align:right">As Of Date</span>
    <span>Source</span>
    <span>Notes</span>
    <span>Section</span>
  </div>`;
  for(const g of os){
    sHTML+=`<div class="group-hdr"><span class="group-hdr-name">📂 ${g}</span></div>`;
    for(const m of gs[g]){
      const ki=m._idx, src=m._src;
      const ro=m.readOnly;
      let valCell, asOfCell, srcCell, noteCell;
      if(src==='monthly'){
        valCell=monthlyValCell(m,ki);
        asOfCell=`<div></div>`;
        srcCell=ro?`<div style="font-size:10.5px;color:#94a3b8">${esc(m.source)||'—'}</div>`:inp(m.source,false,`commitMonthly(${ki},'source',this)`);
        noteCell=ro?`<div style="font-size:10.5px;color:#94a3b8">${esc(m.notes)||'—'}</div>`:inp(m.notes,false,`commitMonthly(${ki},'notes',this)`);
      } else {
        valCell=inp(m.value,true,`commitSetup(${ki},'value',this)`);
        asOfCell=inp(m.asOf,true,`commitSetup(${ki},'asOf',this)`);
        srcCell=inp(m.source,false,`commitSetup(${ki},'source',this)`);
        noteCell=inp(m.notes,false,`commitSetup(${ki},'notes',this)`);
      }
      sHTML+=`<div class="s-grid-row s-cols">
        <div class="cell-name ${ro?'dimmed':''}"><span class="cell-name-text" title="${esc(m.name)}">${esc(m.name)}</span></div>
        ${valCell}${asOfCell}${srcCell}${noteCell}
        <select class="cell-sel" onchange="changeSection('${src}',${ki},this.value)">
          <option value="monthly">Monthly Updates</option>
          <option value="setup" selected>Setup &amp; Property Data</option>
        </select>
      </div>`;
    }
  }

  // ── RESERVES
  let rHTML=`<div class="group-hdr"><span class="group-hdr-name">🛡 Lender Reserves</span></div>
  <div class="r-grid-header r-cols">
    <span>Reserve Name</span><span style="text-align:right">Amount</span><span></span><span></span><span>Notes</span><span></span>
  </div>`;
  for(const r of STATE.reserves){
    const ri=STATE.reserves.indexOf(r);
    rHTML+=`<div class="r-grid-row r-cols">
      ${inp(r.name,false,`commitReserve(${ri},'name',this)`)}
      ${inp(r.amount,true,`commitReserve(${ri},'amount',this)`)}
      <div></div><div></div><div></div>
      <div class="cell-remove"><button class="btn-remove" onclick="removeReserve(${ri})">✕</button></div>
    </div>`;
  }
  rHTML+=`<div class="add-row"><button class="btn-add" onclick="addReserve()">＋ Add reserve</button></div>`;

  // ── ESCROWS
  let eHTML=`<div class="group-hdr"><span class="group-hdr-name">🛡 Lender Escrows</span></div>
  <div class="r-grid-header r-cols">
    <span>Escrow Name</span><span style="text-align:right">Amount</span><span></span><span></span><span>Notes</span><span></span>
  </div>`;
  for(const e of STATE.escrows){
    const ei=STATE.escrows.indexOf(e);
    eHTML+=`<div class="r-grid-row r-cols">
      ${inp(e.name,false,`commitEscrow(${ei},'name',this)`)}
      ${inp(e.amount,true,`commitEscrow(${ei},'amount',this)`)}
      <div></div><div></div><div></div>
      <div class="cell-remove"><button class="btn-remove" onclick="removeEscrow(${ei})">✕</button></div>
    </div>`;
  }
  eHTML+=`<div class="add-row"><button class="btn-add" onclick="addEscrow()">＋ Add escrow</button></div>`;

  // ── KEY DATES
  let kdHTML=`<div class="group-hdr"><span class="group-hdr-name">📅 Key Dates</span></div>
  <div class="kd-grid-header kd-cols">
    <span>Label</span><span style="text-align:right">Due Date</span><span style="text-align:right">Completed</span><span>Notes</span><span></span>
  </div>`;
  for(const kd of STATE.keyDates){
    const ki=STATE.keyDates.indexOf(kd);
    kdHTML+=`<div class="kd-grid-row kd-cols">
      ${inp(kd.label,false,`commitKeyDate(${ki},'label',this)`)}
      ${inp(kd.dueDate,true,`commitKeyDate(${ki},'dueDate',this)`)}
      ${inp(kd.completed,true,`commitKeyDate(${ki},'completed',this)`)}
      ${inp(kd.notes,false,`commitKeyDate(${ki},'notes',this)`)}
      <div class="cell-remove"><button class="btn-remove" onclick="removeKeyDate(${ki})">✕</button></div>
    </div>`;
  }
  kdHTML+=`<div class="add-row"><button class="btn-add" onclick="addKeyDate()">＋ Add key date</button></div>`;

  // ── CONTACTS
  let cHTML=`<div class="c-grid-header c-cols">
    <span>Label</span><span>Name</span><span>Email / URL</span><span>Type</span><span>Notes</span><span></span>
  </div>`;
  for(const c of STATE.contacts){
    const ci=STATE.contacts.indexOf(c);
    cHTML+=`<div class="c-grid-row c-cols">
      ${inp(c.label,false,`commitContact(${ci},'label',this)`)}
      ${inp(c.name,false,`commitContact(${ci},'name',this)`)}
      ${inp(c.emailOrUrl,false,`commitContact(${ci},'emailOrUrl',this)`)}
      <select class="cell-sel" onchange="commitContactSel(${ci},this)">
        <option value="email"    ${c.type==='email'   ?'selected':''}>Email</option>
        <option value="link"     ${c.type==='link'    ?'selected':''}>Link</option>
        <option value="document" ${c.type==='document'?'selected':''}>Document</option>
      </select>
      <span style="font-size:11px;color:#94a3b8">${esc(c.notes)||'—'}</span>
      <div class="cell-remove"><button class="btn-remove" onclick="removeContact(${ci})">✕</button></div>
    </div>`;
  }
  cHTML+=`<div class="add-row"><button class="btn-add" onclick="addContact()">＋ Add contact or link</button></div>`;

  const editableCnt=STATE.monthly.filter(m=>!m.readOnly).length;
  const systemCnt=STATE.monthly.filter(m=>m.calcType==='system').length;

  document.getElementById('content').innerHTML=`
  <div class="panel">
    <div class="panel-head accent" onclick="togglePanel('monthly')">
      <div>
        <div class="panel-title">📅 Monthly Updates
          <span class="badge">${editableCnt} editable</span>
          <span class="badge" style="background:#EEF6FF;color:#1d4ed8">${systemCnt} from actuals</span>
        </div>
        <div class="panel-desc">Values refreshed each month. System rows auto-populate from uploaded actuals. Calculated rows update on blur.</div>
      </div>
      <span class="panel-chevron" id="chevron-monthly">▼</span>
    </div>
    <div class="panel-body open" id="body-monthly">${mHTML}</div>
  </div>

  <div class="panel">
    <div class="panel-head" onclick="togglePanel('setup')">
      <div>
        <div class="panel-title">⚙ Setup &amp; Property Data <span class="badge">${STATE.setup.length} rows</span></div>
        <div class="panel-desc">Property details, loan structure, investment terms, CapEx budget, and KPI targets — updated infrequently.</div>
      </div>
      <span class="panel-chevron" id="chevron-setup">▼</span>
    </div>
    <div class="panel-body open" id="body-setup">${sHTML}${rHTML}${eHTML}${kdHTML}</div>
  </div>

  <div class="panel">
    <div class="panel-head" onclick="togglePanel('contacts')">
      <div>
        <div class="panel-title">👥 Contacts &amp; Links <span class="badge">${STATE.contacts.length} rows</span></div>
        <div class="panel-desc">People, portals, and documents associated with this asset.</div>
      </div>
      <span class="panel-chevron" id="chevron-contacts">▼</span>
    </div>
    <div class="panel-body open" id="body-contacts">${cHTML}</div>
  </div>
  <div style="height:32px"></div>`;
}

/* ═══════════════════════════════════════════════════════════════════
   ADD / REMOVE
═══════════════════════════════════════════════════════════════════ */
function addReserve(){ STATE.reserves.push({id:nextId(),name:'',amount:''}); renderAll(); }
function addEscrow(){  STATE.escrows.push({id:nextId(),name:'',amount:''});  renderAll(); }
function addKeyDate(){ STATE.keyDates.push({id:nextId(),label:'',dueDate:'',completed:'',notes:''}); renderAll(); }
function addContact(){ STATE.contacts.push({id:nextId(),label:'',name:'',emailOrUrl:'',type:'email',notes:''}); renderAll(); }

function removeReserve(i){ STATE.reserves.splice(i,1); renderAll(); }
function removeEscrow(i){  STATE.escrows.splice(i,1);  renderAll(); }
function removeKeyDate(i){ STATE.keyDates.splice(i,1); renderAll(); }
function removeContact(i){ STATE.contacts.splice(i,1); renderAll(); }

/* ═══════════════════════════════════════════════════════════════════
   MONTH CHANGE
═══════════════════════════════════════════════════════════════════ */
document.getElementById('month-sel').addEventListener('change',e=>{
  STATE.month=toMonthKey(e.target.value);
  loadData();
});

/* ═══════════════════════════════════════════════════════════════════
   SAVE & CANCEL
═══════════════════════════════════════════════════════════════════ */
async function saveAll(){
  document.getElementById('btn-save').disabled=true;
  document.getElementById('btn-cancel').disabled=true;
  setStatus('loading','Saving…');

  // Build property-level section map from current STATE
  const sectionAssignments = {};
  STATE.monthly.forEach(m=>{ sectionAssignments[m.key]=m.section||'monthly'; });
  STATE.setup.forEach(m=>{ sectionAssignments[m.key]=m.section||'setup'; });

  const monthlyToSave=STATE.monthly
    .filter(m=>m.calcType!=='system')
    .map(({section,...m})=>({key:m.key,name:m.name,group:m.group,value:m.value,source:m.source,notes:m.notes}));

  try{
    const res=await fetch('/api/property-summary/admin/save',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        month:STATE.month,
        monthlyMetrics:monthlyToSave,
        sectionAssignments,
        setupMetrics:STATE.setup.map(({section,...m})=>({key:m.key,name:m.name,group:m.group,value:m.value,asOf:m.asOf,source:m.source,notes:m.notes})),
        reserves:STATE.reserves,
        escrows:STATE.escrows,
        keyDates:STATE.keyDates,
        contacts:STATE.contacts
      })
    });
    if(res.ok){
      STATE.hasChanges=false;
      await loadData();
    }else{
      setStatus('error','Save failed — try again');
      document.getElementById('btn-save').disabled=false;
      document.getElementById('btn-cancel').disabled=false;
    }
  }catch{
    setStatus('error','Save failed — try again');
    document.getElementById('btn-save').disabled=false;
    document.getElementById('btn-cancel').disabled=false;
  }
}

function cancelChanges(){ loadData(); }

/* ═══════════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════════ */
loadData();
</script>

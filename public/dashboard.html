<body>
<div class="shell">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sb-header">
      <div class="sb-logo">Regatta</div>
      <div class="sb-sub">Financial Dashboard</div>
    </div>
    <nav class="sb-nav">
      <div class="sb-section">Views</div>
      <button class="sb-item active" id="nav-avb" onclick="switchPage('avb')"><span class="sb-icon">📊</span> Actual vs Budget</button>
      <button class="sb-item" id="nav-waterfall" onclick="switchPage('waterfall')"><span class="sb-icon">📉</span> Budget Waterfall</button>
      <button class="sb-item" id="nav-trend" onclick="switchPage('trend')"><span class="sb-icon">📈</span> Trend Analysis</button>

    </nav>

      <div class="sb-btns">
        <a href="/admin" class="sb-btn" id="sb-admin-link" style="display:none">Admin</a>
        <form method="POST" action="/logout" style="flex:1">
          <button type="submit" class="sb-btn" style="width:100%">Sign Out</button>
        </form>
      </div>
    </div>
  </aside>

  <!-- ── MAIN ── -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">Regatta | Actual vs Budget</div>
      <div id="year-sel-wrap" style="margin-left:16px"></div>
      <div id="topbar-dates" class="topbar-dates"></div>
    </div>
    <div class="page" id="app">
      <div class="no-data">Loading data...</div>
    </div>
  </div>

</div>

<script>
/* ═══════════════ PERSISTENCE ═══════════════ */
const CAP_KEY = 'regatta_caprate_v1';
const UNITS_KEY = 'regatta_units_v1';
let capRate = parseFloat(localStorage.getItem(CAP_KEY)) || 6.0;
let numUnits = parseInt(localStorage.getItem(UNITS_KEY)) || 200;
let viewMode = 'amount';
let SEL = null;
let RAW = {};
let PROPERTY = 'Regatta — 1163_rr';
let selYear = null;
let UPDATED_AT = '';

function saveCapRate(v){ capRate=v; localStorage.setItem(CAP_KEY,v); }
function saveUnits(v){ numUnits=v; localStorage.setItem(UNITS_KEY,v); }
function fmtCap(v){ return v.toFixed(2)+'%'; }

/* ═══════════════ CALENDAR ═══════════════ */
const ALL_MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const M_QUARTER={jan:1,feb:1,mar:1,apr:2,may:2,jun:2,jul:3,aug:3,sep:3,oct:4,nov:4,dec:4};
const Q_START={1:'jan',2:'apr',3:'jul',4:'oct'};
const M_LABEL={jan:'Jan',feb:'Feb',mar:'Mar',apr:'Apr',may:'May',jun:'Jun',jul:'Jul',aug:'Aug',sep:'Sep',oct:'Oct',nov:'Nov',dec:'Dec'};
const M_FULL={jan:'January',feb:'February',mar:'March',apr:'April',may:'May',jun:'June',jul:'July',aug:'August',sep:'September',oct:'October',nov:'November',dec:'December'};

const yk = m => String(selYear) + '-' + m;
function hasActuals(m){ return RAW[yk(m)] && Object.values(RAW[yk(m)].a||{}).some(v=>Math.abs(v||0)>0); }
function CLOSED(){ return ALL_MONTHS.filter(m=>hasActuals(m)); }
function LAST(){ const c=CLOSED(); return c[c.length-1]; }
function mRange(from,to){ const fi=ALL_MONTHS.indexOf(from),ti=ALL_MONTHS.indexOf(to); return ALL_MONTHS.slice(fi,ti+1).filter(m=>hasActuals(m)); }
function qtdMonths(sel){ return mRange(Q_START[M_QUARTER[sel]],sel); }
function ytdMonths(sel){ return mRange('jan',sel); }
const mlbl=m=>(M_FULL[m]||m)+' '+selYear;
const rangeLbl=ms=>ms.length===1?M_LABEL[ms[0]]:M_LABEL[ms[0]]+'\u2013'+M_LABEL[ms[ms.length-1]];
const qlbl=(sel)=>'Q'+M_QUARTER[sel]+' '+selYear+' ('+rangeLbl(qtdMonths(sel))+')';
const ylbl=(sel)=>'YTD '+selYear+' ('+rangeLbl(ytdMonths(sel))+')';

const KEYS=['pri','ltl','vac','mod','con','bd','trr','oi','ur','toi','egi','payroll','adv','ga','util','rm','contract','mgmt','mr','taxes','ins','opex','noi','amfee','debt','capex','ncf'];

const TRR_DETAIL  = ['pri','ltl','vac','mod','con','bd'];
const TOI_DETAIL  = ['oi','ur'];
const OPEX_DETAIL = ['payroll','adv','ga','util','rm','contract','mgmt','mr','taxes','ins'];
const TDF_DETAIL  = ['amfee','debt'];

function computeTotals(v){
  v.trr  = TRR_DETAIL.reduce((s,k)=>s+(v[k]||0),0);
  v.toi  = TOI_DETAIL.reduce((s,k)=>s+(v[k]||0),0);
  v.egi  = v.trr+v.toi;
  v.opex = OPEX_DETAIL.reduce((s,k)=>s+(v[k]||0),0);
  v.noi  = v.egi-v.opex;
  v.tdf  = TDF_DETAIL.reduce((s,k)=>s+(v[k]||0),0);
  v.cfd  = v.noi-v.tdf;
  v.btl  = (v.capex||0);
  v.netinc = v.cfd-v.btl;
}

function deriveMonth(a,b){
  computeTotals(a); computeTotals(b);
  b.bnetinc=b.netinc;
  a.phyvac=a.pri?Math.abs(a.vac)/a.pri*100:0; b.phyvac=b.pri?Math.abs(b.vac)/b.pri*100:0;
  a.ecovac=a.pri?(a.pri-a.trr)/a.pri*100:0;  b.ecovac=b.pri?(b.pri-b.trr)/b.pri*100:0;
  a.expr=a.egi?a.opex/a.egi*100:0;           b.expr=b.egi?b.opex/b.egi*100:0;
  a.propval=capRate>0?(a.noi*12)/(capRate/100):0;
  b.propval=capRate>0?(b.noi*12)/(capRate/100):0;
}

function buildPeriod(months){
  const a={},b={};
  KEYS.forEach(k=>{ a[k]=months.reduce((s,mo)=>s+(RAW[yk(mo)]?.a[k]||0),0); b[k]=months.reduce((s,mo)=>s+(RAW[yk(mo)]?.b[k]||0),0); });
  computeTotals(a); computeTotals(b);
  b.bnetinc=b.netinc;
  a.phyvac=a.pri?Math.abs(a.vac)/a.pri*100:0; b.phyvac=b.pri?Math.abs(b.vac)/b.pri*100:0;
  a.ecovac=a.pri?(a.pri-a.trr)/a.pri*100:0;   b.ecovac=b.pri?(b.pri-b.trr)/b.pri*100:0;
  a.expr=a.egi?a.opex/a.egi*100:0;            b.expr=b.egi?b.opex/b.egi*100:0;
  a.propval=capRate>0?(a.noi*12/months.length)/(capRate/100):0;
  b.propval=capRate>0?(b.noi*12/months.length)/(capRate/100):0;
  return {a,b};
}

/* ═══════════════ GRADIENT ═══════════════ */
/* 5-color banded heat scale — section-independent */
const BAND5=['#F8696B','#F4B183','#FFEB84','#A9D18E','#63BE7B'];
const GRAD_GROUPS={
  'income':{keys:['pri','ltl','vac','mod','con','bd'],income:true},
  'other-income':{keys:['oi','ur'],income:true},
  'expenses':{keys:['payroll','adv','ga','util','rm','contract','mgmt','mr','taxes','ins'],income:false}
};
function buildGradStats(C,Q,Y,puFn,nC,nQ,nY){
  /* puFn + period counts must match what renderTbody uses so min/max are in the active unit */
  const st={curr:{},qtd:{},ytd:{}};
  for(const[gn,gi]of Object.entries(GRAD_GROUPS)){
    const cd=gi.keys.map(k=>puFn(C.a[k]||0,nC)-puFn(C.b[k]||0,nC));
    const qd=gi.keys.map(k=>puFn(Q.a[k]||0,nQ)-puFn(Q.b[k]||0,nQ));
    const yd=gi.keys.map(k=>puFn(Y.a[k]||0,nY)-puFn(Y.b[k]||0,nY));
    const safe=a=>a.length?a:[0];
    st.curr[gn]={mn:Math.min(...safe(cd)),mx:Math.max(...safe(cd)),income:gi.income};
    st.qtd[gn]={mn:Math.min(...safe(qd)),mx:Math.max(...safe(qd)),income:gi.income};
    st.ytd[gn]={mn:Math.min(...safe(yd)),mx:Math.max(...safe(yd)),income:gi.income};
  }
  return st;
}
function bandColor(delta,mn,mx,invert){
  if(mn===mx) return BAND5[2]; // all equal → neutral
  const bandSize=(mx-mn)/5;
  let b=Math.floor((delta-mn)/bandSize);
  b=Math.max(0,Math.min(4,b));
  return BAND5[invert?4-b:b];
}
function gradStyle(delta,groupName,period,stats){
  const{mn,mx,income}=stats[period][groupName];
  /* expenses: lower delta (underspent) = favorable = green → invert band index */
  return `background:${bandColor(delta,mn,mx,!income)};color:#1A2B2C;font-weight:700`;
}
function dirStyle(delta,income,dark){
  const fav=income?delta>0:delta<0;
  const neut=Math.abs(delta)<50;
  if(neut) return dark?'color:rgba(255,255,255,.5)':'color:#888';
  if(dark) return fav?'background:#166534;color:#A7F3D0;font-weight:700':'background:#7F1D1D;color:#FCA5A5;font-weight:700';
  return fav?'background:#C6EFCE;color:#276221;font-weight:700':'background:#FFC7CE;color:#9C0006;font-weight:700';
}
/* 3-color % variance threshold — for subtotals and key totals */
const TOTAL_ROW_TYPES=new Set(['sub','egi','noi','cfd','btl','net']);
function thresholdStyle(delta,budget){
  const absBudget=Math.abs(budget||0);
  let absPercent;
  if(absBudget<1){
    /* budget is zero/near-zero — judge by absolute delta size */
    absPercent=Math.abs(delta)>5000?100:Math.abs(delta)>500?10:2;
  } else {
    absPercent=Math.min(100,Math.abs(delta/budget)*100);
  }
  const bg=absPercent<=2?'#63BE7B':absPercent<=5?'#FFEB84':'#F8696B';
  return `background:${bg};color:#1A2B2C;font-weight:700`;
}

/* ═══════════════ FORMATTERS ═══════════════ */
const fD=v=>{if(v===null||v===undefined||v===0) return '\u2014';const s=Math.round(Math.abs(v)).toLocaleString('en-US');return v<0?'('+s+')':s;};
const fSign=v=>{if(Math.abs(v||0)<50) return '\u2014';const s=Math.round(Math.abs(v)).toLocaleString('en-US');return v<0?'('+s+')':'+'+s;};
const fPct=(v,d=1)=>(!isFinite(v)||Math.abs(v)<0.05)?'\u2014':((v>0?'+':'')+v.toFixed(d)+'%');
const fPp=v=>isFinite(v)?v.toFixed(2)+'%':'\u2014';
function toPerUnit(v,n){if(!numUnits||numUnits===0) return v;return(v/n*12)/numUnits;}

function renderTbody(m){
  Object.keys(RAW).forEach(k=>deriveMonth(RAW[k].a,RAW[k].b));
  const C=RAW[yk(m)];
  const pi=ALL_MONTHS.indexOf(m)-1;
  const prevM=ALL_MONTHS[pi];
  const P=(pi>=0&&hasActuals(prevM))?RAW[yk(prevM)]:null;
  const qtdMs=qtdMonths(m),ytdMs=ytdMonths(m);
  const Q=buildPeriod(qtdMs),Y=buildPeriod(ytdMs);
  const nC=1,nQ=qtdMs.length,nY=ytdMs.length;
  const pu=(v,n)=>viewMode==='perunit'?toPerUnit(v,n):v;
  const GS=buildGradStats(C,Q,Y,pu,nC,nQ,nY);
  let html='';
  ROWS.forEach(row=>{
    if(row.t==='spacer'){html+=`<tr class="r-spacer"><td colspan="11"></td></tr>`;return;}
    if(row.t==='spacer-sm'){html+=`<tr class="r-spacer-sm"><td colspan="11"></td></tr>`;return;}
    if(row.t==='section'){html+=`<tr class="r-section"><td class="cat" colspan="11">${row.label}</td></tr>`;return;}
    if(row.t==='section-lt'){html+=`<tr class="r-section-lt"><td class="cat" colspan="11">${row.label}</td></tr>`;return;}
    const trCls=ROW_MAP[row.t]||'r-data';
    const dark=DARK_ROWS.has(trCls);
    const k=row.key;
    const sepW=dark?'sep sep-wh':'sep';
    if(row.t==='metric'){
      const ca=C.a[k]||0,cb=C.b[k]||0,qa=Q.a[k]||0,qb=Q.b[k]||0,ya=Y.a[k]||0,yb=Y.b[k]||0;
      const lo=v=>`style="${v<0?'color:#1A7030':'color:#C02020'};font-weight:600"`;
      let momTxt='\u2014';
      if(P){const d=ca-(P.a[k]||0);if(Math.abs(d)>0.05)momTxt=fPct(d,2);}
      html+=`<tr class="r-metric"><td class="cat" style="font-style:italic">${row.label}</td>
        <td class="mom-cell" style="text-align:right;padding-right:8px;font-family:'Courier New',monospace;font-style:italic">${momTxt}</td>
        <td class="num" style="font-style:italic">${fPp(ca)}</td><td class="num" style="font-style:italic">${fPp(cb)}</td>
        <td class="del" ${lo(ca-cb)}>${fPct(ca-cb,2)}</td>
        <td class="num ${sepW}" style="font-style:italic"></td><td class="num" style="font-style:italic">${fPp(qa)}</td>
        <td class="del" ${lo(qa-qb)}>${fPct(qa-qb,2)}</td>
        <td class="num ${sepW}" style="font-style:italic"></td><td class="num" style="font-style:italic">${fPp(ya)}</td>
        <td class="del" ${lo(ya-yb)}>${fPct(ya-yb,2)}</td></tr>`;
      return;
    }
    if(row.t==='propval'){
      const ca=C.a[k]||0,cb=C.b[k]||0,qa=Q.a[k]||0,qb=Q.b[k]||0,ya=Y.a[k]||0,yb=Y.b[k]||0;
      const ds=(d,bv)=>`style="${thresholdStyle(d,bv)}"`;
      html+=`<tr class="r-propval"><td class="cat" style="font-style:italic;color:#3A5A5E">Property Value (${fmtCap(capRate)} cap)</td>
        <td class="mom-cell">\u2014</td>
        <td class="num" style="font-style:italic">${fD(ca)}</td><td class="num" style="font-style:italic">${fD(cb)}</td>
        <td class="del" ${ds(ca-cb,cb)}>${fSign(ca-cb)}</td>
        <td class="num sep" style="font-style:italic">${fD(qa)}</td><td class="num" style="font-style:italic">${fD(qb)}</td>
        <td class="del" ${ds(qa-qb,qb)}>${fSign(qa-qb)}</td>
        <td class="num sep" style="font-style:italic">${fD(ya)}</td><td class="num" style="font-style:italic">${fD(yb)}</td>
        <td class="del" ${ds(ya-yb,yb)}>${fSign(ya-yb)}</td></tr>`;
      return;
    }
    const caR=C.a[k]||0;
    const cbR=k==='netinc'?(C.b.bnetinc||C.b[k]||0):(C.b[k]||0);
    const qaR=Q.a[k]||0,qbR=k==='netinc'?(Q.b.bnetinc||Q.b[k]||0):(Q.b[k]||0);
    const yaR=Y.a[k]||0,ybR=k==='netinc'?(Y.b.bnetinc||Y.b[k]||0):(Y.b[k]||0);
    const ca=pu(caR,nC),cb=pu(cbR,nC),qa=pu(qaR,nQ),qb=pu(qbR,nQ),ya=pu(yaR,nY),yb=pu(ybR,nY);
    const cd=ca-cb,qd=qa-qb,yd=ya-yb;
    function delSt(d,period){
      if(row.t==='data'&&row.group) return 'style="'+gradStyle(d,row.group,period,GS)+'"';
      if(TOTAL_ROW_TYPES.has(row.t)){
        const bv=period==='curr'?cb:period==='qtd'?qb:yb;
        return 'style="'+thresholdStyle(d,bv)+'"';
      }
      return 'style="'+dirStyle(d,row.income,dark)+'"';
    }
    let momTd='<td class="mom-cell">\u2014</td>';
    if(P){
      const paR=P.a[k]||0,mdR=caR-paR,mp=paR!==0?mdR/Math.abs(paR)*100:0;
      if(Math.abs(mdR)>=50){
        const md=pu(mdR,nC),fav=row.income?md>0:md<0;
        const ac=fav?'arr-up':'arr-dn',ar=mdR>0?'\u25b2':'\u25bc';
        momTd=`<td class="mom-cell"><span class="${ac}">${ar}</span><span class="mom-v">${fD(md)}</span><span class="mom-p"> ${fPct(mp)}</span></td>`;
      }
    }
    html+=`<tr class="${trCls}"><td class="cat${row.ind?' ind':''}">${row.label}</td>${momTd}
      <td class="num">${fD(ca)}</td><td class="num">${fD(cb)}</td><td class="del" ${delSt(cd,'curr')}>${fSign(cd)}</td>
      <td class="num ${sepW}">${fD(qa)}</td><td class="num">${fD(qb)}</td><td class="del" ${delSt(qd,'qtd')}>${fSign(qd)}</td>
      <td class="num ${sepW}">${fD(ya)}</td><td class="num">${fD(yb)}</td><td class="del" ${delSt(yd,'ytd')}>${fSign(yd)}</td></tr>`;
  });
  document.getElementById('tbody').innerHTML=html;
}

function buildWaterfallData(months, perUnit) {
  if (!months || months.length === 0) return null;
  const RAW_KEYS = ['pri','ltl','vac','mod','con','bd','oi','ur',
                    'payroll','adv','ga','util','rm','contract','mgmt','mr','taxes','ins',
                    'amfee','debt','capex'];
  const a = {}, b = {};
  RAW_KEYS.forEach(k => {
    a[k] = months.reduce((s, m) => s + (RAW[yk(m)]?.a[k] || 0), 0);
    b[k] = months.reduce((s, m) => s + (RAW[yk(m)]?.b[k] || 0), 0);
  });
  computeTotals(a); computeTotals(b);
  const n = (perUnit && numUnits > 0) ? numUnits : 1;
  const pu = v => v / n;

  const steps = [];
  steps.push({type:'total', label:'Budget NOI', value: pu(b.noi)});
  let running = pu(b.noi);

  for (const item of WF_INCOME_ITEMS) {
    const av = pu(a[item.key] || 0), bv = pu(b[item.key] || 0);
    if (Math.abs(a[item.key]||0) < 1 && Math.abs(b[item.key]||0) < 1) continue;
    const variance = av - bv;
    if (Math.abs(variance) < (perUnit ? 0.01 : 1)) continue;
    steps.push({type:'variance', section:'income', label:item.label,
      value:variance, base:running, favorable:variance > 0, actual:av, budget:bv});
    running += variance;
  }

  for (const item of WF_EXPENSE_ITEMS) {
    const av = pu(a[item.key] || 0), bv = pu(b[item.key] || 0);
    if (Math.abs(a[item.key]||0) < 1 && Math.abs(b[item.key]||0) < 1) continue;
    const variance = bv - av;
    if (Math.abs(variance) < (perUnit ? 0.01 : 1)) continue;
    steps.push({type:'variance', section:'expense', label:item.label,
      value:variance, base:running, favorable:variance > 0, actual:av, budget:bv});
    running += variance;
  }

  steps.push({type:'total', label:'Actual NOI', value: pu(a.noi)});

  for (const s of steps) {
    if (s.type === 'total') {
      s.barBottom = Math.min(0, s.value);
      s.barTop    = Math.max(0, s.value);
      s.runningAfter = s.value;
    } else {
      s.barBottom = Math.min(s.base, s.base + s.value);
      s.barTop    = Math.max(s.base, s.base + s.value);
      s.runningAfter = s.base + s.value;
    }
  }

  return {steps, a, b, n};
}

/* ═══════════════ WATERFALL CHART ═══════════════ */
function fWF(v) {
  if (Math.abs(v || 0) < 0.005) return '$0';
  const abs = Math.abs(v);
  let str;
  if (abs >= 1000000) str = '$' + (abs / 1000000).toFixed(1) + 'M';
  else str = '$' + Math.round(abs).toLocaleString('en-US');
  return v < 0 ? '(' + str.slice(1) + ')' : str;
}

function niceWfTicks(yMin, yMax, count) {
  const range = yMax - yMin || 1;
  const rawStep = range / count;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const niceSteps = [1, 2, 2.5, 5, 10];
  const niceStep = mag * (niceSteps.find(s => s * mag >= rawStep) || 10);
  const start = Math.ceil(yMin / niceStep) * niceStep;
  const ticks = [];
  for (let t = start; t <= yMax + niceStep * 0.01; t += niceStep) {
    ticks.push(Math.round(t / niceStep) * niceStep);
  }
  return ticks;
}

function drawWaterfallSVG(containerId, data) {
  const container = document.getElementById(containerId);
  if (!container || !data) return;
  const {steps} = data;
  const W = Math.max(container.clientWidth || 700, 560);
  const H = 390;
  const mL = 76, mR = 16, mT = 28, mB = 94;
  const chartW = W - mL - mR, chartH = H - mT - mB;
  const n = steps.length;
  const slotW = chartW / n;
  const barW = Math.min(Math.max(slotW * 0.60, 18), 56);
  const gapW = (slotW - barW) / 2;

  let yMin = 0, yMax = 0;
  for (const s of steps) {
    yMin = Math.min(yMin, s.barBottom);
    yMax = Math.max(yMax, s.barTop);
  }
  const pad = Math.max((yMax - yMin) * 0.18, 500);
  yMin -= pad * 0.05;
  yMax += pad;
  const yRange = yMax - yMin;
  const yToSVG = v => mT + (yMax - v) / yRange * chartH;
  const yZero  = yToSVG(0);

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="display:block;font-family:Segoe UI,system-ui,sans-serif">`;
  svg += `<clipPath id="wfc"><rect x="${mL}" y="${mT}" width="${chartW}" height="${chartH}"/></clipPath>`;

  const incomeIdxs = steps.reduce((a,s,i)=>s.section==='income'?[...a,i]:a,[]);
  const expenseIdxs = steps.reduce((a,s,i)=>s.section==='expense'?[...a,i]:a,[]);

  if (incomeIdxs.length) {
    const x1 = mL + incomeIdxs[0] * slotW;
    const x2 = mL + (incomeIdxs[incomeIdxs.length-1]+1) * slotW;
    svg += `<rect x="${x1}" y="${mT}" width="${x2-x1}" height="${chartH}" fill="rgba(134,239,172,0.16)" clip-path="url(#wfc)"/>`;
  }
  if (expenseIdxs.length) {
    const x1 = mL + expenseIdxs[0] * slotW;
    const x2 = mL + (expenseIdxs[expenseIdxs.length-1]+1) * slotW;
    svg += `<rect x="${x1}" y="${mT}" width="${x2-x1}" height="${chartH}" fill="rgba(252,165,165,0.16)" clip-path="url(#wfc)"/>`;
  }

  const ticks = niceWfTicks(yMin, yMax, 5);
  svg += `<g clip-path="url(#wfc)">`;
  for (const t of ticks) {
    const ty = yToSVG(t);
    svg += `<line x1="${mL}" y1="${ty}" x2="${mL+chartW}" y2="${ty}" stroke="#e5e7eb" stroke-width="1"/>`;
  }
  svg += `</g>`;
  for (const t of ticks) {
    const ty = yToSVG(t);
    if (ty >= mT - 6 && ty <= mT + chartH + 6) {
      svg += `<text x="${mL-6}" y="${ty+4}" text-anchor="end" font-size="10" fill="#777">${fWF(t)}</text>`;
    }
  }

  if (yZero >= mT && yZero <= mT + chartH) {
    svg += `<line x1="${mL}" y1="${yZero}" x2="${mL+chartW}" y2="${yZero}" stroke="#999" stroke-width="1.5"/>`;
  }

  for (let i = 0; i < steps.length - 1; i++) {
    const s = steps[i];
    const x1 = mL + i * slotW + gapW + barW;
    const x2 = mL + (i+1) * slotW + gapW;
    const cy = yToSVG(s.runningAfter);
    if (cy >= mT - 2 && cy <= mT + chartH + 2) {
      svg += `<line x1="${x1}" y1="${cy}" x2="${x2}" y2="${cy}" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2"/>`;
    }
  }

  for (let i = 0; i < steps.length; i++) {
    const s = steps[i];
    const barX  = mL + i * slotW + gapW;
    const barTop = Math.max(yToSVG(s.barTop), mT);
    const barBot = Math.min(yToSVG(s.barBottom), mT + chartH);
    const barH2 = Math.max(barBot - barTop, 2);
    const fill = s.type === 'total' ? '#13545E' : (s.favorable ? '#22a06b' : '#e5493a');
    svg += `<rect x="${barX}" y="${barTop}" width="${barW}" height="${barH2}" fill="${fill}" rx="2"/>`;

    const labelTxt = fWF(s.value);
    const cx = barX + barW / 2;
    const labelY = s.value >= 0 ? Math.max(barTop - 5, mT + 10) : barBot + 12;
    const labelColor = s.type === 'total' ? '#0E3D45' : (s.favorable ? '#155C2C' : '#7F1D1D');
    svg += `<text x="${cx}" y="${labelY}" text-anchor="middle" font-size="9.5" font-weight="600" fill="${labelColor}">${labelTxt}</text>`;
  }

  for (let i = 0; i < steps.length; i++) {
    const s = steps[i];
    const lx = mL + i * slotW + slotW / 2;
    const ly = mT + chartH + 10;
    const isBold = s.type === 'total';
    svg += `<text transform="translate(${lx},${ly}) rotate(-40)" text-anchor="end" font-size="10" fill="${isBold?'#13545E':'#444'}" font-weight="${isBold?'700':'400'}">${s.label}</text>`;
  }

  if (incomeIdxs.length) {
    const x1 = mL + incomeIdxs[0] * slotW;
    const x2 = mL + (incomeIdxs[incomeIdxs.length-1]+1) * slotW;
    svg += `<text x="${(x1+x2)/2}" y="${H-6}" text-anchor="middle" font-size="10" font-weight="700" fill="#166534" letter-spacing="0.04em">Income Line Item Variance</text>`;
  }
  if (expenseIdxs.length) {
    const x1 = mL + expenseIdxs[0] * slotW;
    const x2 = mL + (expenseIdxs[expenseIdxs.length-1]+1) * slotW;
    svg += `<text x="${(x1+x2)/2}" y="${H-6}" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b" letter-spacing="0.04em">Expense Line Item Variance</text>`;
  }

  svg += `</svg>`;
  container.innerHTML = svg;
}

function renderWfTable(data) {
  if (!data) return;
  const {a, b, n} = data;
  const pu = v => v / n;
  const fmt = v => {
    if (Math.abs(v||0) < 0.005) return '\u2014';
    const s = Math.round(Math.abs(v)).toLocaleString('en-US');
    return v < 0 ? '('+s+')' : s;
  };
  const varFmt = (av, bv, isIncome) => {
    const d = av - bv;
    const fav = isIncome ? d > 0 : d < 0;
    if (Math.abs(d) < 0.005) return {str:'\u2014', fav:null};
    const s = Math.round(Math.abs(d)).toLocaleString('en-US');
    return {str: d < 0 ? '('+s+')' : s, fav};
  };
  const badge = f => f === null
    ? '<span class="wf-neutral">\u2014</span>'
    : f ? '<span class="wf-fav">F</span>' : '<span class="wf-unfav">U</span>';

  let html = '';
  html += `<tr class="wf-section-hdr" style="color:#166534"><td colspan="5">Income</td></tr>`;
  for (const item of WF_INCOME_ITEMS) {
    const av = pu(a[item.key]||0), bv = pu(b[item.key]||0);
    if (Math.abs(av) < 0.005 && Math.abs(bv) < 0.005) continue;
    const vf = varFmt(av, bv, true);
    html += `<tr><td style="padding-left:20px">${item.label}</td><td>${fmt(av)}</td><td>${fmt(bv)}</td><td>${vf.str}</td><td>${badge(vf.fav)}</td></tr>`;
  }
  const egiVar = varFmt(pu(a.egi), pu(b.egi), true);
  html += `<tr class="wf-subtotal"><td>Effective Gross Income</td><td>${fmt(pu(a.egi))}</td><td>${fmt(pu(b.egi))}</td><td>${egiVar.str}</td><td>${badge(egiVar.fav)}</td></tr>`;

  html += `<tr class="wf-section-hdr" style="color:#991b1b"><td colspan="5">Expenses</td></tr>`;
  for (const item of WF_EXPENSE_ITEMS) {
    const av = pu(a[item.key]||0), bv = pu(b[item.key]||0);
    if (Math.abs(av) < 0.005 && Math.abs(bv) < 0.005) continue;
    const vf = varFmt(av, bv, false);
    html += `<tr><td style="padding-left:20px">${item.label}</td><td>${fmt(av)}</td><td>${fmt(bv)}</td><td>${vf.str}</td><td>${badge(vf.fav)}</td></tr>`;
  }
  const opexVar = varFmt(pu(a.opex), pu(b.opex), false);
  html += `<tr class="wf-subtotal"><td>Total Operating Expenses</td><td>${fmt(pu(a.opex))}</td><td>${fmt(pu(b.opex))}</td><td>${opexVar.str}</td><td>${badge(opexVar.fav)}</td></tr>`;

  const noiVar = varFmt(pu(a.noi), pu(b.noi), true);
  html += `<tr class="wf-total"><td>Net Operating Income</td><td>${fmt(pu(a.noi))}</td><td>${fmt(pu(b.noi))}</td><td>${noiVar.str}</td><td>${badge(noiVar.fav)}</td></tr>`;

  document.getElementById('wf-tbody').innerHTML = html;
}

function buildTrendData(catKey, perUnit) {
  const cat = TREND_CAT_MAP[catKey];
  if (!cat) return [];
  const closed = CLOSED();
  const pu = v => perUnit && numUnits > 0 ? (v * 12) / numUnits : v;
  return closed.map(m => {
    const a = Object.assign({}, RAW[yk(m)].a), b = Object.assign({}, RAW[yk(m)].b);
    computeTotals(a); computeTotals(b);
    const actual = pu(a[catKey] || 0);
    const budget = pu(b[catKey] || 0);
    const variance = actual - budget;
    const favorable = cat.income ? variance >= 0 : variance <= 0;
    return {month: m, actual, budget, variance, favorable};
  });
}

function drawTrendSVG(containerId, rows, cat) {
  const container = document.getElementById(containerId);
  if (!container || !rows || rows.length === 0) return;

  const W = Math.max(container.clientWidth || 700, 500);
  const H = 340;
  const mL = 76, mR = 20, mT = 44, mB = 54;
  const chartW = W - mL - mR, chartH = H - mT - mB;
  const n = rows.length;
  const slotW = chartW / n;
  const barW = Math.min(Math.max(slotW * 0.55, 14), 52);
  const gapW = (slotW - barW) / 2;

  let yMin = 0, yMax = 0;
  rows.forEach(r => {
    yMin = Math.min(yMin, r.actual, r.budget);
    yMax = Math.max(yMax, r.actual, r.budget);
  });
  const pad = Math.max((yMax - yMin) * 0.2, 1000);
  yMin -= pad * 0.05;
  yMax += pad * 0.18;
  const yRange = yMax - yMin;
  const yToSVG = v => mT + (yMax - v) / yRange * chartH;
  const yZero  = yToSVG(0);

  const favColor   = '#22a06b', unfavColor = '#e5493a', budgetColor = '#374151';
  const favLabel   = cat.income ? 'Over Budget'  : 'Under Budget';
  const unfavLabel = cat.income ? 'Under Budget' : 'Over Budget';

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="display:block;font-family:Segoe UI,system-ui,sans-serif">`;
  svg += `<clipPath id="trc"><rect x="${mL}" y="${mT}" width="${chartW}" height="${chartH}"/></clipPath>`;

  /* Legend */
  const legY = 15;
  svg += `<rect x="${mL}" y="${legY-8}" width="13" height="13" fill="${unfavColor}" rx="2"/>`;
  svg += `<text x="${mL+17}" y="${legY+3}" font-size="10" fill="#444">${unfavLabel}</text>`;
  svg += `<rect x="${mL+110}" y="${legY-8}" width="13" height="13" fill="${favColor}" rx="2"/>`;
  svg += `<text x="${mL+127}" y="${legY+3}" font-size="10" fill="#444">${favLabel}</text>`;
  svg += `<line x1="${mL+218}" y1="${legY}" x2="${mL+236}" y2="${legY}" stroke="${budgetColor}" stroke-width="1.5" stroke-dasharray="4,3"/>`;
  svg += `<circle cx="${mL+227}" cy="${legY}" r="3" fill="${budgetColor}" stroke="#fff" stroke-width="1"/>`;
  svg += `<text x="${mL+240}" y="${legY+3}" font-size="10" fill="#444">Budget</text>`;

  /* Y gridlines */
  const ticks = niceWfTicks(yMin, yMax, 5);
  svg += `<g clip-path="url(#trc)">`;
  ticks.forEach(t => {
    const ty = yToSVG(t);
    svg += `<line x1="${mL}" y1="${ty}" x2="${mL+chartW}" y2="${ty}" stroke="#e5e7eb" stroke-width="1"/>`;
  });
  svg += `</g>`;
  ticks.forEach(t => {
    const ty = yToSVG(t);
    if (ty >= mT - 6 && ty <= mT + chartH + 6)
      svg += `<text x="${mL-6}" y="${ty+4}" text-anchor="end" font-size="10" fill="#777">${fWF(t)}</text>`;
  });

  /* Zero line */
  if (yZero >= mT && yZero <= mT + chartH)
    svg += `<line x1="${mL}" y1="${yZero}" x2="${mL+chartW}" y2="${yZero}" stroke="#999" stroke-width="1.5"/>`;

  /* Bars */
  rows.forEach((r, i) => {
    const barX  = mL + i * slotW + gapW;
    const barTop = Math.max(yToSVG(Math.max(0, r.actual)), mT);
    const barBot = Math.min(yToSVG(Math.min(0, r.actual)), mT + chartH);
    const barH2  = Math.max(barBot - barTop, 2);
    svg += `<rect x="${barX}" y="${barTop}" width="${barW}" height="${barH2}" fill="${r.favorable ? favColor : unfavColor}" rx="2"/>`;

    const cx   = barX + barW / 2;
    const lblTxt = fWF(r.actual);
    const lblY = r.actual >= 0 ? Math.max(barTop - 4, mT + 9) : Math.min(barBot + 11, mT + chartH - 4);
    svg += `<text x="${cx}" y="${lblY}" text-anchor="middle" font-size="9" font-weight="600" fill="${r.favorable ? '#155C2C' : '#7F1D1D'}">${lblTxt}</text>`;
  });

  /* Budget line */
  const pts = rows.map((r, i) => {
    const cx = mL + i * slotW + slotW / 2;
    const cy = Math.max(mT, Math.min(mT + chartH, yToSVG(r.budget)));
    return `${cx},${cy}`;
  }).join(' ');
  if (rows.length > 1)
    svg += `<polyline points="${pts}" fill="none" stroke="${budgetColor}" stroke-width="1.5" stroke-dasharray="5,4" clip-path="url(#trc)"/>`;
  rows.forEach((r, i) => {
    const cx = mL + i * slotW + slotW / 2;
    const cy = Math.max(mT, Math.min(mT + chartH, yToSVG(r.budget)));
    svg += `<circle cx="${cx}" cy="${cy}" r="3" fill="${budgetColor}" stroke="#fff" stroke-width="1"/>`;
  });

  /* X-axis labels */
  rows.forEach((r, i) => {
    const cx = mL + i * slotW + slotW / 2;
    const ly = mT + chartH + 10;
    svg += `<text x="${cx}" y="${ly+9}"  text-anchor="middle" font-size="9.5" fill="#444">${M_LABEL[r.month]}</text>`;
    svg += `<text x="${cx}" y="${ly+20}" text-anchor="middle" font-size="8.5" fill="#888">${selYear}</text>`;
  });

  svg += `</svg>`;
  container.innerHTML = svg;
}

  document.getElementById('app').innerHTML = `
    <div class="controls-bar">
      <div class="cap-group">
        <span class="cap-lbl">View</span>
        <div class="seg-btn">
          <button class="${!trPerUnit?'active':''}" onclick="setTrMode(false)">Total</button>
          <button class="${trPerUnit?'active':''}"  onclick="setTrMode(true)">Per Unit</button>
        </div>
      </div>
    </div>
    <div class="tr-layout">
      <div class="tr-slicer">${slicerHTML}</div>
      <div class="tr-content">
        <div class="wf-chart-wrap"><div id="tr-chart"></div></div>
        <div class="wf-table-wrap">
          <table class="wf-table">
            <thead><tr>
              <th style="text-align:left">Month</th>
              <th>Actual</th><th>Budget</th><th>Variance</th><th>Var %</th><th>F/U</th>
            </tr></thead>
            <tbody id="tr-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>`;

  setTimeout(() => {
    const rows = buildTrendData(trCat, trPerUnit);
    drawTrendSVG('tr-chart', rows, cat);
    renderTrendTable(rows);
  }, 0);
}

function renderTrendTable(rows) {
  const fmt = v => {
    if (Math.abs(v||0) < 0.005) return '\u2014';
    const s = Math.round(Math.abs(v)).toLocaleString('en-US');
    return v < 0 ? '('+s+')' : s;
  };
  const fmtPct = (v, b) => {
    if (!b || Math.abs(b) < 0.005) return '\u2014';
    const p = (v / Math.abs(b)) * 100;
    return (p >= 0 ? '+' : '') + p.toFixed(1) + '%';
  };
  const badge = fav => fav ? '<span class="wf-fav">F</span>' : '<span class="wf-unfav">U</span>';

  document.getElementById('tr-tbody').innerHTML = rows.map(r => `
    <tr>
      <td style="font-family:inherit">${M_FULL[r.month]||r.month} ${selYear}</td>
      <td>${fmt(r.actual)}</td><td>${fmt(r.budget)}</td>
      <td>${fmt(r.variance)}</td><td>${fmtPct(r.variance, r.budget)}</td>
      <td>${badge(r.favorable)}</td>
    </tr>`).join('');
}

window.setTrCat  = function(k)  { trCat = k; renderTrendPage(); };
window.setTrMode = function(pu) { trPerUnit = pu; renderTrendPage(); };

/* ═══════════════ INIT ═══════════════ */
async function init(){
  try{
    const [dataRes, meRes] = await Promise.all([fetch('/api/data'), fetch('/api/me')]);
    const d  = await dataRes.json();
    const me = await meRes.json();
    RAW=d.months||{};
    PROPERTY=d.property||'Regatta — 1163_rr';
    UPDATED_AT=d.updatedAt||'';

    const years=[...new Set(Object.keys(RAW).map(k=>parseInt(k.split('-')[0])).filter(y=>!isNaN(y)))].sort();
    selYear = years.length>0 ? years[years.length-1] : (d.year||new Date().getFullYear());

    const wrap=document.getElementById('year-sel-wrap');
    if(wrap){
      if(years.length>1){
        const opts=years.map(y=>`<option value="${y}"${y===selYear?' selected':''}>${y}</option>`).join('');
        wrap.innerHTML=`<select class="year-sel" onchange="setYear(parseInt(this.value))">${opts}</select>`;
      } else if(years.length===1){
        wrap.innerHTML=`<span class="year-badge">${selYear}</span>`;
      }
    }

    if(me.role==='admin'){
      document.getElementById('sb-admin-link').style.display='';
    }
    const hash = location.hash.replace('#','');
    if(hash === 'waterfall' || hash === 'trend') switchPage(hash);
    else renderApp();
  } catch(e){
    document.getElementById('app').innerHTML=`<div class="no-data">Error loading data: ${e.message}</div>`;
  }
}

window.setYear=function(y){
  selYear=y;
  SEL=null;
  wfPeriodType='month'; wfPeriodValue=null;
  const sel=document.querySelector('.year-sel');
  if(sel) sel.value=y;
  renderApp();
};

init();
</script>

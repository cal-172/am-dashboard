<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Regatta Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#DCE8EA;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:6px;box-shadow:0 4px 24px rgba(0,0,0,.14);padding:40px 36px;width:340px;max-width:95vw}
.logo{text-align:center;margin-bottom:28px}
.logo-title{font-size:18px;font-weight:700;color:#13545E;letter-spacing:-.01em}
.logo-sub{font-size:11px;color:#6A8E91;margin-top:4px;letter-spacing:.04em;text-transform:uppercase}
label{display:block;font-size:11px;font-weight:700;color:#13545E;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
input[type=text],input[type=password]{width:100%;padding:9px 11px;font-size:13px;border:1.5px solid #B0CDD1;border-radius:4px;outline:none;color:#1A2B2C;transition:border-color .15s}
input:focus{border-color:#13545E;box-shadow:0 0 0 3px rgba(19,84,94,.1)}
.field{margin-bottom:18px}
.btn{width:100%;padding:10px;background:#13545E;color:#fff;border:none;border-radius:4px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.02em;transition:background .15s}
.btn:hover{background:#0D3D45}
.err{background:#FFF0F0;border:1px solid #F8696B;color:#7F1D1D;padding:9px 12px;border-radius:4px;font-size:12px;margin-bottom:18px;display:none}
.err.show{display:block}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-title">Regatta — 1163_rr</div>
    <div class="logo-sub">Financial Dashboard</div>
  </div>
  <div id="err" class="err">Invalid username or password.</div>
  <form method="POST" action="/login">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">Sign In</button>
  </form>
</div>
<script>
  if(location.search.includes('error=1')) document.getElementById('err').classList.add('show');
</script>
</body>
</html>

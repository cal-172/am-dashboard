<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Regatta Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#DCE8EA;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:8px;box-shadow:0 4px 28px rgba(0,0,0,.13);padding:44px 40px;width:360px;max-width:95vw}
.logo{text-align:center;margin-bottom:32px}
.logo-mark{width:44px;height:44px;background:#13545E;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:20px;color:#fff;font-weight:800;letter-spacing:-.02em}
.logo-title{font-size:17px;font-weight:700;color:#13545E}
.logo-sub{font-size:10.5px;color:#6A8E91;margin-top:3px;letter-spacing:.07em;text-transform:uppercase}
label{display:block;font-size:11px;font-weight:700;color:#13545E;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
input[type=email],input[type=text],input[type=password]{width:100%;padding:10px 12px;font-size:13.5px;border:1.5px solid #B0CDD1;border-radius:5px;outline:none;color:#1A2B2C;transition:border-color .15s;background:#fff}
input:focus{border-color:#13545E;box-shadow:0 0 0 3px rgba(19,84,94,.1)}
.field{margin-bottom:18px}
.btn{width:100%;padding:11px;background:#13545E;color:#fff;border:none;border-radius:5px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.02em;transition:background .15s;font-family:inherit}
.btn:hover{background:#0D3D45}
.err{background:#FEF2F2;border:1px solid #FCA5A5;color:#7F1D1D;padding:10px 12px;border-radius:5px;font-size:12.5px;margin-bottom:20px;display:none}
.err.show{display:block}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">R</div>
    <div class="logo-title">Regatta</div>
    <div class="logo-sub">Financial Dashboard</div>
  </div>
  <div id="err" class="err">Invalid email or password. Please try again.</div>
  <form method="POST" action="/login">
    <div class="field">
      <label for="email">Email</label>
      <input type="text" id="email" name="email" autocomplete="username" autofocus required placeholder="your@email.com">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn">Sign In</button>
  </form>
</div>
<script>
  if(location.search.includes('error=1')) document.getElementById('err').classList.add('show');
</script>
</body>
</html>
